<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#180a2c">
<title>Happy Diwali – With Love, Pooja</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 25%,#51205f 0,#210d36 48%,#090817 100%);color:#ffe9a6;font-family:Georgia,serif;text-align:center}
.scene{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px 34px;position:relative;isolation:isolate}
.scene:before{content:"";position:fixed;inset:0;z-index:-1;background-image:radial-gradient(#ffd66b 1px,transparent 1.5px),radial-gradient(#ff8ac7 1px,transparent 1.5px);background-size:83px 83px,127px 127px;background-position:0 0,35px 50px;opacity:.4;animation:twinkle 3s infinite alternate}
@keyframes twinkle{to{opacity:.8}}
h1{font-size:clamp(2.6rem,10vw,5rem);line-height:1.05;margin:15px 0;color:#ffda72;text-shadow:0 0 8px #ff9e24,0 0 25px #ff7a00}
.sub{font-size:clamp(1.1rem,4vw,1.5rem);color:#ffe8cf}
.lights{display:grid;grid-template-columns:repeat(4,minmax(48px,68px));gap:20px;margin:32px auto}
.light{border:0;background:transparent;font-size:clamp(2.5rem,9vw,3.6rem);cursor:pointer;filter:drop-shadow(0 0 9px #ffbd48);animation:pulse 1.8s infinite alternate}
.light:nth-child(even){animation-delay:.7s}@keyframes pulse{to{transform:scale(1.12);filter:drop-shadow(0 0 20px #fff18a)}}
.hint{font:15px Arial,sans-serif;color:#f9d9a4;opacity:.85}
.reveal{display:none;max-width:520px;padding:26px 20px;border:1px solid #ffdb83;border-radius:22px;background:linear-gradient(145deg,rgba(122,37,30,.94),rgba(64,19,76,.96));box-shadow:0 0 35px #ffb52b55;animation:appear .9s ease-out}
.reveal.show{display:block}@keyframes appear{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
.reveal h2{font: bold clamp(2.4rem,9vw,4rem) Georgia,serif;letter-spacing:2px;color:#ffe58c;text-shadow:0 0 18px #ffb000;margin:12px 0}
.reveal p{font-size:1.15rem;line-height:1.5}.signature{font-size:clamp(1.7rem,7vw,2.6rem);color:#ff8ac7;text-shadow:0 0 15px #ff168b;margin-top:20px}
.replay{display:none;margin:20px auto 0;border:0;border-radius:30px;padding:12px 22px;background:#ffdf85;color:#40134c;font-weight:bold;font-size:1rem;cursor:pointer}
.replay.show{display:inline-block}.decor{font-size:2rem;margin:10px}
</style>
</head>
<body>
<main class="scene">
<div class="decor">✨ 🌙 ✨</div>
<div class="sub">A FESTIVAL OF LIGHTS</div>
<p class="sub">Touch any glowing light for a surprise</p>
<div class="lights" id="lights">
<button class="light" aria-label="Touch light">🪔</button><button class="light" aria-label="Touch light">✨</button>
<button class="light" aria-label="Touch light">🪔</button><button class="light" aria-label="Touch light">✨</button>
<button class="light" aria-label="Touch light">✨</button><button class="light" aria-label="Touch light">🪔</button>
<button class="light" aria-label="Touch light">✨</button><button class="light" aria-label="Touch light">🪔</button>
</div>
<div class="hint" id="hint">Your little Diwali surprise is waiting 💛</div>
<section class="reveal" id="reveal">
<div class="decor">🎆 🪔 🎆</div>
<h2>HAPPY<br>DIWALI!</h2>
<p>May your life shine with happiness, love and prosperity.</p>
<div class="signature">With Love,<br>POOJA ❤️</div>
<div class="decor">✨ 🎇 🌸 🎇 ✨</div>
</section>
<button class="replay" id="replay">Replay surprise ↻</button>
</main>
<script>
const lights=[...document.querySelectorAll('.light')],reveal=document.getElementById('reveal'),hint=document.getElementById('hint'),replay=document.getElementById('replay');
function revealGreeting(){reveal.classList.add('show');hint.textContent='A little light, a lot of happiness! 💛';replay.classList.add('show');lights.forEach(b=>b.style.transform='scale(1.2)')}
lights.forEach(b=>b.addEventListener('click',revealGreeting));
replay.addEventListener('click',()=>{reveal.classList.remove('show');replay.classList.remove('show');hint.textContent='Your little Diwali surprise is waiting 💛';lights.forEach(b=>b.style.transform='')});
</script>
</body></html>
